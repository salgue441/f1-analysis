services:
  workbench:
    build: .
    image: pitwall-workbench
    volumes:
      - .:/workspace
    env_file:
      - path: .env
        required: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Defaults match the local S3 store (PITWALL_ENV=s3local); real keys in .env win.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-pitwall}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-pitwall-secret}
    ports:
      - "3000:3000"   # Dagster UI
      - "4040:4040"   # Spark UI (local mode driver)
      - "8501:8501"   # Streamlit
      - "8888:8888"   # JupyterLab
    depends_on:
      - mlflow

  mlflow:
    image: pitwall-workbench
    build: .
    volumes:
      - .:/workspace
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////workspace/data/mlflow/mlflow.db
      --default-artifact-root /workspace/data/mlflow/artifacts
    ports:
      - "5000:5000"

  # Optional standalone cluster: `docker compose --profile cluster up -d`
  # then set spark.master: spark://spark-master:7077 in conf/local.yaml
  spark-master:
    image: pitwall-workbench
    profiles: ["cluster"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - .:/workspace
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: pitwall-workbench
    profiles: ["cluster"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "3g"
    volumes:
      - .:/workspace
    depends_on:
      - spark-master
    deploy:
      replicas: 2

  # Optional S3-compatible store (SeaweedFS): `docker compose --profile s3 up -d`, then
  # PITWALL_ENV=s3local runs the same code against s3a://pitwall/lakehouse (docs/cloud.md).
  s3:
    image: chrislusf/seaweedfs:3.80
    profiles: ["s3"]
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data
      - ./deploy/s3local/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"   # S3 API

  s3-init:
    image: chrislusf/seaweedfs:3.80
    profiles: ["s3"]
    depends_on:
      - s3
    entrypoint: >
      sh -c "until echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q pitwall;
      do echo 's3.bucket.create -name pitwall' | weed shell -master=s3:9333; sleep 2; done"

volumes:
  s3-data:
