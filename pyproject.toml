[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "0.1.0"
description = "Quantifying F1 race strategy under uncertainty: lakehouse + Bayesian, causal and simulation models."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.1,<3",
    "pyarrow>=14",
    "numpy>=1.26,<2.1",
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6",
    "fastf1>=3.4",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "mlflow>=2.16",
]

[project.optional-dependencies]
# Local and self-managed Spark. Managed platforms (EMR, Databricks) bring their own, so it is
# an extra: installing pyspark there would shadow the platform build.
spark = ["pyspark>=3.5,<3.6", "delta-spark>=3.2,<3.3"]
ds = [
    "pymc>=5.16",
    "arviz>=0.19",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4",
    "streamlit>=1.38",
    "plotly>=5.20",
    "nutpie>=0.13",
    "statsmodels>=0.14",
    "deltalake>=0.18",
]
causal = [
    "econml>=0.15",
    "dowhy>=0.11",
]
live = ["paho-mqtt>=2.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "chispa>=0.10",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "pitwall.orchestration.definitions"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N812"]  # `functions as F` is the PySpark convention

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (model recovery, large data)"]
addopts = "-m 'not slow'"
